[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.2.0"
description = "Multi-provider coding agent with CLI, terminal, and Streamlit frontends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "streamlit-ace>=0.1.1",
]

[project.scripts]
hermes = "hermes.frontends.cli:main"
hermes-tui = "hermes.frontends.tui.app:main"

[tool.setuptools.packages.find]
include = ["hermes*"]
